spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
  redis:
    host: ${REDIS_HOST}
    port: 6379
    ssl: true

shifa:
  cors:
    allowed-origins: "https://app.shifa.com"
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: 86400000
    refreshExpirationMs: 604800000
  claude:
    apiKey: ${CLAUDE_API_KEY}
    model: ${CLAUDE_MODEL:claude-3-opus-20240229}
    maxTokens: 1000
  whatsapp:
    apiUrl: ${WHATSAPP_API_URL}
    token: ${WHATSAPP_TOKEN}
    phoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3Bucket: ${AWS_S3_BUCKET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
